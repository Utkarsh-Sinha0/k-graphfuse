[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "k-graphfuse"
version = "0.1.0"
description = "Reusable sparse graph polynomial plans, directional sensitivities, and optional CUDA execution"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/MIT.txt"]
authors = [{name = "Utkarsh Sinha"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]
keywords = ["graph analytics", "pagerank", "sparse matrix", "CUDA", "polynomial filter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
gpu = ["torch>=2.11"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[project.urls]
Homepage = "https://utkarsh-sinha0.github.io/k-graphfuse/"
Documentation = "https://utkarsh-sinha0.github.io/k-graphfuse/"
Repository = "https://github.com/Utkarsh-Sinha0/k-graphfuse"
Issues = "https://github.com/Utkarsh-Sinha0/k-graphfuse/issues"
Benchmarks = "https://utkarsh-sinha0.github.io/k-graphfuse/benchmarks/results/"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["c2fuse", "sparse_c2fuse", "fast_bounds", "sensitivity_c2fuse", "chebyshev_ppr", "local_c2fuse", "ppr_certificate", "cuda_c2fuse"]

[tool.setuptools.packages.find]
where = ["src"]
